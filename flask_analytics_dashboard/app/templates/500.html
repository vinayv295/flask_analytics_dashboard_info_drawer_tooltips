{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}

<div class="error-page">

    <div>

        <h1>500</h1>

        <h2>Something Went Wrong</h2>

        <p>
            The server encountered an unexpected error.
            Please try again.
        </p>

        <a
            href="{{ url_for('main.dashboard') }}"
            class="btn btn-primary"
        >
            Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
