{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}

<div class="error-page">

    <div>

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>
            The page you are looking for does not exist
            or may have been moved.
        </p>

        <a
            href="{{ url_for('main.dashboard') }}"
            class="btn btn-primary"
        >
            Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
